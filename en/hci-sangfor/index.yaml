title: HCI Cloud Platform
description:
  - >-
    HCI Cloud Platform is a self-service cloud platform that lets you create and
    manage <a href="console-guide/virtual-machines">virtual machines</a>,
    configure <a href="console-guide/networking">VPC networks</a>, and deploy
    managed services including
    <a href="console-guide/databases">databases</a>, and connect your
    <a href="console-guide/kubernetes">Kubernetes clusters to HCI storage</a>
    — all from a single platform.
  - >-
    Each tenant gets a logically isolated
    <a href="console-guide/networking">Virtual Private Cloud</a> with subnets,
    elastic IPs, access control, and port mapping. Virtual machine data is
    protected through <a href="console-guide/virtual-machines#snapshots">snapshots</a>
    and <a href="console-guide/virtual-machines#backup">scheduled backups</a>
    with file-level recovery.
  - >-
    The platform includes a
    <a href="console-guide/monitoring">monitoring dashboard</a> for tracking VM
    and network performance, configurable alerts, and a resource quota overview.

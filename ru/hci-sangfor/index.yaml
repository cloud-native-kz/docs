title: Облачная платформа HCI
description:
  - >-
    Облачная платформа HCI — это самообслуживаемая облачная платформа, которая позволяет
    создавать и управлять <a href="console-guide/virtual-machines">виртуальными машинами</a>,
    настраивать <a href="console-guide/networking">VPC-сети</a>, разворачивать
    управляемые сервисы, включая <a href="console-guide/databases">базы данных</a>,
    и подключать <a href="console-guide/kubernetes">Kubernetes-кластеры к хранилищу HCI</a>
    — всё в одном месте.
  - >-
    Каждый тенант получает логически изолированное
    <a href="console-guide/networking">виртуальное частное облако (VPC)</a> с подсетями,
    эластичными IP-адресами, контролем доступа и проброской портов. Данные виртуальных машин
    защищены с помощью <a href="console-guide/virtual-machines#snapshots">снэпшотов</a>
    и <a href="console-guide/virtual-machines#backup">резервного копирования по расписанию</a>
    с восстановлением на уровне файлов.
  - >-
    Платформа включает
    <a href="console-guide/monitoring">панель мониторинга</a> для отслеживания
    производительности ВМ и сети, настраиваемые оповещения и обзор квот ресурсов.
